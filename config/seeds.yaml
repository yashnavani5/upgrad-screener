# Calibration seeds (docs/SPEC.md section 3.11).
# positives: founders/companies a reviewer agrees SHOULD rank highly.
# negatives: founders/companies that should NOT make the shortlist.
# Used to report recall@50 and to sanity-check weight changes. They never feed the scores directly.
#
# Entries with origin: auto are rewritten after every scoring run (`screener seeds refresh`) by a rule that never
# reads scores or weights:
#   positive = India + passes every hard gate + gap-map fit + a corroborated recent round or a listed top investor
#   negative = a claim-backed hard exclusion (competitor at scale, upGrad-owned, too large, not education)
# To overrule one, add your own entry (any origin other than auto, or no origin): reviewer entries are never
# changed, and a company you list on one side is never auto-added to the other. Each entry needs a source URL:
#   - company: <name>
#     website: <url>
#     source_url: <url>
#     reason: <why>
#     origin: reviewer
