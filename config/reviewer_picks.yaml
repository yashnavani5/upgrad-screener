# Reviewer picks: companies the upGrad team asked the pipeline to consider (`screener reviewer import`).
#
# What goes where:
# - company / website / founders / sources become discoveries with scout "reviewer" and this file's `origin`, so
#   the pipeline resolves, enriches and verifies them like any other candidate. Every fact on a card still comes
#   from a fetched source with a quote; nothing in this file is stored as a fact.
# - category + note become the "Reviewer label" / "Reviewer note" (feedback table): shown on cards and in the
#   Sheet as the reviewer's view, never as verified evidence. A note typed in the Sheet wins over this file.
# - Add the company names to the AI Policy's "Must consider" list to guarantee a shortlist slot (still only when
#   every gate and verification check passes).
#
# website: only a domain checked to be the company's own (title names it); leave null to let resolve find it.
# sources: real articles about the company, used as discovery sources (checked 2026-10-26).
origin: Analyst shortlist (Oct 2026)
picks:
  - company: SpeakX
    website: https://speakx.ai
    founders: [Arpit Mittal]
    category: acquire
    sources:
      - https://india.entrepreneur.com/news-and-trends/speakxai-raises-usd-16-mn-to-strengthen-ai-powered-english/498354
      - https://entrackr.com/news/edtech-startup-speakx-raises-16-mn-led-by-westbridge-10559891
    note: >-
      Spoken English is the hidden prerequisite behind most of upGrad's working-professional and Internshala users,
      and SpeakX is adding regional-language support. Flag: Ronnie Screwvala's angel stake gives a warm path in, but
      it is a related-party situation that needs formal conflict handling.

