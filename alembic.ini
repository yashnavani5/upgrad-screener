# For ad-hoc Alembic CLI use (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The app itself runs migrations via `uv run screener db init`. The DB URL comes from DATABASE_URL.
[alembic]
script_location = src/screener/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
