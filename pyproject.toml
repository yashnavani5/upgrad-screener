[project]
name = "screener"
version = "0.1.0"
description = "upGrad Founder Screener: discover, verify, score and shortlist education founders."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "trafilatura>=2.0",
    "protego>=0.3",
    "playwright>=1.49",
    "google-genai>=1.0",
    "ddgs>=9.0",
    "fastembed>=0.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.10",
    "tldextract>=5.1",
    "unidecode>=1.3",
    "choix>=0.3.5",
    "gspread>=6.1",
    "google-auth>=2.36",
    "feedparser>=6.0",
    "ruamel-yaml>=0.18",
]

[project.scripts]
screener = "screener.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: needs a real Postgres in TEST_DATABASE_URL (skipped otherwise)",
]
